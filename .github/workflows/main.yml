name: Secret Scan
on: [push, pull_request]

jobs:
  betterleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Offizielles Binary direkt von Betterleaks Release herunterladen
      - name: Install Betterleaks
        run: |
          BETTERLEAKS_VERSION="1.8.1" # Gewünschte Version fixieren
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks-linux-amd64.tar.gz" | tar -xz
          sudo mv betterleaks /usr/local/bin/

      - name: Run Betterleaks
        run: |
          betterleaks dir --verbose .
